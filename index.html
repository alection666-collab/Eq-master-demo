p{margin:6px 0}.mu{color:var(--mu)}.warn{border-left:3px solid var(--or);padding:8px 12px;background:#2b2621;border-radius:0 6px 6px 0;margin:12px 0;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--te)}.card small{color:var(--mu)}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#1f3a36;color:var(--te);margin:2px 4px 2px 0}.tag.o{background:#43301f;color:var(--or)}.tag.g{background:#26391f;color:var(--gr)}

canvas{width:100%;height:auto;background:#17191b;border:1px solid var(--ln);border-radius:8px;display:block}

const LIVE=[['FOH и мониторы (Monitor Mixing)','В FOH вы формируете звук для зала, в мониторах для исполнителя: нужны ясность и безопасный запас до обратной связи. EQ в мониторе часто режет резонансы, а не «украшает».'],['Обратная связь (Feedback Control)','Начните с положения микрофона и угла, потом с уровня, потом с узкого среза. Находите частоту по звону, делайте срез узким, 1/3 октавы или уже, и ограничивайтесь минимальной глубиной.'],['Графический или параметрический EQ','Графический удобен для быстрой подстройки зала и мониторов. Параметрический (Parametric EQ) точнее при работе с конкретной частотой и Q.'],['Резонансы помещения (Room Resonances)','Низкие резонансы зависят от размеров зала и положения PA. Лечите их размещением и HPF, а не только подъёмом/срезом.'],['Перекрёстное затухание (Stage Bleed)','Большой bleed в микрофонах делает EQ каждого канала общим для всех. Гейт, дистанция и направленность часто эффективнее.'],['Микрофоны и сцена (Microphone Placement / Stage Acoustics)','Позиция микрофона даёт больше, чем кривая EQ. Сначала положение, потом EQ.']];
const STUDIO=[['Корректирующий EQ (Corrective)','Решает конкретные проблемы: резонансы, мутность, шипение.'],['Творческий EQ (Creative)','Формирует характер. Меняйте осознанно, сверяйте на других системах.'],['Вычитающий и добавляющий (Subtractive / Additive)','Сначала убирайте мешающее, потом подчёркивайте нужное. Это порядок работы, а не закон.'],['Динамический EQ (Dynamic EQ)','Корректирует только когда область превышает порог: хорош для сибилянтов и редких резонансов.'],['Mid/Side EQ','Позволяет менять центр и стерео-края отдельно, но следите за фазой в моно.'],['Параллельная обработка (Parallel Processing)','Смешивайте обработанный и сухой сигнал для сохранения динамики.'],['Маскировка (Frequency Masking)','Источники с близкими частотами скрывают друг друга. Уступайте в одном источнике ровно настолько, насколько это нужно.'],['Фазовые отношения (Phase Relationships)','Несколько микрофонов на один источник могут гасить низ или середину: проверьте полярность до EQ.']];
const TRAIN=[['Частота (Frequency)','Число колебаний в секунду, Гц. Одна октава равна удвоению частоты: 100 → 200 → 400 Гц.'],['Усиление (Gain)','Подъём или срез уровня в дБ на выбранной частоте. Малые изменения 1–3 дБ уже слышны.'],['Добротность (Q Factor)','Чем выше Q, тем уже полоса. Низкий Q (0,5–1) мягкий и музыкальный, высокий (4+) хирургический.'],['Колокол (Bell Filter)','Поднимает или срезает область вокруг центральной частоты.'],['Фильтр высоких (High Pass Filter, HPF)','Пропускает частоты выше среза, убирая гул и низ, который источник не производит.'],['Фильтр низких (Low Pass Filter, LPF)','Убирает высоту выше среза: шипение, шум.'],['Полочный (Shelf Filter)','Меняет всё выше (High Shelf) или ниже (Low Shelf) выбранной частоты.'],['Маскировка (Frequency Masking)','Громкий звук делает неслышным близкий по частоте. Часто решается аранжировкой и панорамой.'],['Метод поиска (Sweep EQ)','Поднимите узкий bell на +6…+10 дБ, плавно водите по спектру, найдите неприятное место, затем срежьте умеренно.'],['Как слушать диапазоны','Сравнивайте до/после на одинаковой громкости, делайте паузы, проверяйте на разных системах.']];

/* ===== UI ===== */
const $=s=>document.querySelector(s),app=$('#app');
const NAV=['live','studio','lib','calc','conf','prob','train'];
const fmt=h=>h>=1000?(h/1000).toString().replace('.',',')+' кГц':h+' Гц';
const warn='<div class="warn">Все значения ориентировочные и зависят от инструмента, исполнителя, микрофона, помещения и микса. Это не универсальные пресеты: слушайте и проверяйте.</div>';
const acc=a=>a.map(([t,b])=>`<details><summary>${t}</summary><p>${b}</p></details>`).join('');
const allIns=()=>Object.entries(CAT).flatMap(([c,l])=>l.map(n=>({c,n})));
function route(){const h=location.hash.slice(1)||'lib',[p,arg]=h.split('/');$('#nav').innerHTML=NAV.map(k=>`<a href="#${k}" class="${k===p?'on':''}">${T(k)}</a>`).join('');
 ({live:()=>pageText(T('live'),'Для живого звука',LIVE,true),studio:()=>pageText(T('studio'),'Для студийной работы',STUDIO,false),lib:()=>lib(),ins:()=>ins(decodeURIComponent(arg||'')),calc:calc,conf:conf,prob:prob,train:train}[p]||lib)();window.scrollTo(0,0)}
function pageText(t,sub,list,live){app.innerHTML=`<h1>${t}</h1><p class="mu">${sub}</p>${warn}${acc(isPro()?list:list.slice(0,FREE_TXT))}${isPro()?'':lock('Остальные темы раздела входят в полную версию.')}<h2>Рекомендации по инструментам</h2><div class="grid">${Object.keys(INS).filter(AV).map(n=>`<a class="card" href="#ins/${encodeURIComponent(n)}"><h3>${n}</h3><small>${live?INS[n].live:'HPF ≈ '+INS[n].hpf[1]+', LPF ≈ '+INS[n].lpf[1]}</small></a>`).join('')}</div>`}
let q='',cat='ALL';
function lib(){app.innerHTML=`<h1>${T('lib')}</h1>${isPro()?'':lock('Бесплатно доступны 8 основных инструментов. Остальные инструменты, все частотные конфликты, полные разделы Live и Studio и тренажёр слуха входят в полную версию.')}<p class="mu">Поиск и фильтр по категории. Подробные страницы пока готовы для ${Object.keys(INS).length} инструментов, остальные добавляются через файл данных.</p><input id="q" placeholder="Поиск инструмента" value="${q}" aria-label="Поиск"><div class="chips" id="ch"></div><div class="grid" id="gl"></div>`;
 const draw=()=>{$('#ch').innerHTML=['ALL',...Object.keys(CAT)].map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c==='ALL'?'Все':c}</button>`).join('');
 $('#gl').innerHTML=allIns().filter(i=>(cat==='ALL'||i.c===cat)&&i.n.toLowerCase().includes(q.toLowerCase())).map(i=>INS[i.n]&&AV(i.n)?`<a class="card" href="#ins/${encodeURIComponent(i.n)}"><h3>${i.n}</h3><small>${INS[i.n].d}</small><br><span class="tag">${i.c}</span><span class="tag g">данные есть</span></a>`:`<div class="card"><h3>${i.n}</h3><span class="tag">${i.c}</span><span class="tag o">${INS[i.n]?'Pro':'в разработке'}</span></div>`).join('')||'<p class="mu">Ничего не найдено. Измените запрос или категорию.</p>';
 document.querySelectorAll('#ch button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()})};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}
function ins(n){const i=INS[n];if(!i){location.hash='lib';return}
 if(!AV(n)){app.innerHTML=`<p><a href="#lib" class="mu">← Библиотека</a></p><h1>${n}</h1>`+lock('Страница этого инструмента входит в полную версию.');return}
 const kv=[['Основная частота (Fundamental)',i.fund],['Диапазон',i.rng],['Гармоники (Harmonics)',i.harm],['Атака (Attack)',i.att],['Тело (Body)',i.body],['Присутствие (Presence)',i.pres],['Яркость (Brightness)',i.bri],['HPF Live / Studio',i.hpf.join(' / ')],['LPF Live / Studio',i.lpf.join(' / ')],['Возможные конфликты',i.conf.join(', ')]];
 const pr=Object.entries(i.prob).map(([k,r])=>`<span class="tag o">${PR[k].n.split('—')[0]} ${fmt(r[0])}–${fmt(r[1])}</span>`).join('');
 app.innerHTML=`<p><a href="#lib" class="mu">← Библиотека</a></p><h1>${n}</h1><p>${i.d}</p>${warn}<div class="kv">${kv.map(([a,b])=>`<div><span>${a}</span>${b}</div>`).join('')}</div><h2>Проблемные области</h2><p>${pr}</p><h2>Для живого звука</h2><p>${i.live}</p><h2>Частотные области</h2><p class="mu">Нажмите строку, чтобы раскрыть подробности.</p><div class="sc"><table><tr><th>Диапазон</th><th>Область</th><th>На слух</th><th>Подъём</th><th>Срез</th></tr>${BANDS.map((b,k)=>`<tr class="cl" data-k="${k}"><td class="f">${fmt(b.r[0])}–${fmt(b.r[1])}</td><td>${b.n}</td><td>${b.h}</td><td>${b.up}</td><td>${b.dn}</td></tr><tr class="dt" hidden><td colspan="5"><b>Когда применять:</b> ${b.when}<br><b>Побочные эффекты:</b> ${b.fx}</td></tr>`).join('')}</table></div>`;
 document.querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>{r.nextElementSibling.hidden=!r.nextElementSibling.hidden})}
function prob(){app.innerHTML=`<h1>${T('prob')}</h1>${warn}<div class="row"><select id="pi">${Object.keys(INS).filter(AV).map(n=>`<option>${n}</option>`).join('')}</select><select id="pp">${Object.entries(PR).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div><div id="po"></div>`;
 const go=()=>{const i=INS[$('#pi').value],k=$('#pp').value,p=PR[k],r=i.prob[k]||p.r;$('#po').innerHTML=`<div class="out"><h3>${p.n}</h3><p><b>Диапазон:</b> <span class="ok">${fmt(r[0])}–${fmt(r[1])}</span> ${i.prob[k]?'(для выбранного инструмента)':'(общий ориентир)'}</p><p><b>Возможные причины:</b></p><ul>${p.why.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Диагностика:</b> ${p.dx}</p><p><b>Решения:</b> ${p.fix.join('; ')}.</p><p class="bad"><b>Проверьте до EQ:</b> ${p.chk}</p></div>`};$('#pi').onchange=$('#pp').onchange=go;go()}
function calc(){app.innerHTML=`<h1>${T('calc')}</h1><div class="warn">Кривая ниже иллюстрация, а не универсальный пресет.</div><div class="row"><select id="ci">${Object.keys(INS).filter(AV).map(n=>`<option>${n}</option>`).join('')}</select><select id="cp">${Object.entries(PR).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><select id="cm"><option value="live">Live</option><option value="studio">Studio</option></select></div><canvas id="cv" width="640" height="260" aria-label="Иллюстрация параметрического эквалайзера"></canvas><div id="co"></div>`;
 const go=()=>{const i=INS[$('#ci').value],k=$('#cp').value,m=$('#cm').value,p=PR[k],r=i.prob[k]||p.r,c=Math.round(Math.sqrt(r[0]*r[1])),live=m==='live',g=p.g.map(x=>live?Math.round(x*.6*10)/10:x),qr=p.q,mid=(g[0]+g[1])/2,qm=(qr[0]+qr[1])/2;
 $('#co').innerHTML=`<div class="out"><div class="kv"><div><span>Центр (ориентир)</span>${fmt(c)}</div><div><span>Область поиска</span>${fmt(r[0])}–${fmt(r[1])}</div><div><span>Фильтр</span>${p.t}</div><div><span>Q (ориентир)</span>${qr[0]}–${qr[1]}</div><div><span>Gain</span>${g[0]}…${g[1]} дБ</div></div><p><b>Почему может помочь:</b> ${p.why[0]}. <b>Когда не сработает:</b> ${p.no}</p>${live?'<p class="bad">В Live делайте срезы осторожнее и проверяйте запас до обратной связи.</p>':'<p class="ok">В студии сравнивайте на одинаковой громкости и на других системах.</p>'}</div>`;
 draw(c,mid,qm,k)};
 $('#ci').onchange=$('#cp').onchange=$('#cm').onchange=go;go()}
function draw(c,g,Q,k){const cv=$('#cv'),x=cv.getContext('2d'),W=cv.width,H=cv.height,lx=f=>Math.log(f/20)/Math.log(1000)*W,dy=d=>H/2-d/15*H/2;
 x.clearRect(0,0,W,H);x.strokeStyle='#363a40';x.fillStyle='#9aa1a9';x.font='12px Manrope';
 [50,100,200,500,1000,2000,5000,10000].forEach(f=>{x.beginPath();x.moveTo(lx(f),0);x.lineTo(lx(f),H);x.stroke();x.fillText(f>=1000?f/1000+'k':f,lx(f)+3,H-4)});
 [-12,-6,0,6,12].forEach(d=>{x.beginPath();x.moveTo(0,dy(d));x.lineTo(W,dy(d));x.stroke();x.fillText(d+' дБ',4,dy(d)-3)});
 const sh=k==='dull',lo=k==='boomy'||k==='thin',s=.41/Q;const cur=f=>{const t=Math.log(f/c);if(sh)return g/(1+Math.exp(-t*3));return g*Math.exp(-.5*(t/s)**2)};
 x.strokeStyle=g<0?'#ff8a3d':'#2dd4bf';x.lineWidth=3;x.beginPath();for(let i=0;i<=W;i+=2){const f=20*Math.pow(1000,i/W),d=cur(f);i?x.lineTo(i,dy(d)):x.moveTo(i,dy(d))}x.stroke();x.lineWidth=1}
function conf(){app.innerHTML=`<h1>${T('conf')}</h1>${warn}${CONF.slice(0,isPro()?99:FREE_CONF).map(c=>`<details><summary>${c.n}</summary><p><b>Диапазоны:</b> ${c.r}</p><p><b>Проявление:</b> ${c.s}</p><p><b>Как найти источник:</b> ${c.f}</p><p><b>Решения:</b></p><ul>${c.x.map(x=>`<li>${x}</li>`).join('')}</ul><p class="bad"><b>Почему не всегда резать оба:</b> ${c.w}</p></details>`).join('')}${isPro()?'':lock('Остальные пары инструментов входят в полную версию.')}`}
let ctx,src,filt,ans;
function train(){if(!isPro()){app.innerHTML=`<h1>${T('train')}</h1>${acc(TRAIN)}<h2>Упражнение: угадай частоту</h2>`+lock('Тренажёр слуха входит в полную версию. Теория выше доступна бесплатно.');return}
 app.innerHTML=`<h1>${T('train')}</h1>${acc(TRAIN)}<h2>Упражнение: угадай частоту</h2><p class="mu">Шум с подъёмом +12 дБ в одной октавной области. Слушайте на умеренной громкости и выберите ответ.</p><div class="row"><button id="pl">Играть</button><button id="st" class="s">Стоп</button></div><div class="chips" id="ans"></div><p id="res" class="mu"></p>`;
 const F=[125,250,500,1000,2000,4000,8000];$('#ans').innerHTML=F.map(f=>`<button data-f="${f}">${fmt(f)}</button>`).join('');
 const stop=()=>{try{src&&src.stop()}catch(e){}src=null};
 $('#pl').onclick=()=>{stop();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ans=F[Math.floor(Math.random()*F.length)];const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);let b0=0,b1=0,b2=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.05;d[i]=(b0+b1+b2+w*.18)*.12}
  src=ctx.createBufferSource();src.buffer=b;src.loop=true;filt=ctx.createBiquadFilter();filt.type='peaking';filt.frequency.value=ans;filt.Q.value=1.4;filt.gain.value=12;const gn=ctx.createGain();gn.gain.value=.4;src.connect(filt).connect(gn).connect(ctx.destination);src.start();$('#res').textContent='Играет. Какой подъём вы слышите?'};
 $('#st').onclick=stop;
 document.querySelectorAll('#ans button').forEach(b=>b.onclick=()=>{if(!ans){$('#res').textContent='Сначала нажмите «Играть».';return}const ok=+b.dataset.f===ans;$('#res').innerHTML=ok?`<span class="ok">Верно: ${fmt(ans)}.</span>`:`<span class="bad">Не совсем. Подъём был на ${fmt(ans)}.</span>`;})}
window.addEventListener('hashchange',route);route();
</script></body></html>

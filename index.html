const FOH=[["Задача FOH (Front of House)","FOH — это звук для зала. Вы отвечаете за общий баланс, тональность и динамику, которые слышит публика. Слушайте не только за пультом: пройдите по залу, проверьте зону перед сценой, середину и задние ряды, и ориентируйтесь на самую проблемную точку, а не на идеальную."],["Система и зал (PA System, Room Resonances)","Сначала убедитесь, что проблема не в самой системе: покрытие, положение акустики, фазировка сабвуфера и топов. Широкие перекосы тембра зала правят на мастере (графический EQ), а узкие подъёмы низа часто вызваны помещением. Тембр отдельного канала такими правками не лечат."]];
const MON=[["Задача мониторного микса (Monitor Mixing)","Мониторы нужны исполнителю, а не залу: он должен комфортно слышать себя и ключевые источники. Это про ясность и безопасный запас до обратной связи, а не про красивый звук. Договоритесь с музыкантом, что именно ему нужно слышать, и начинайте с минимума."],["Запас до обратной связи (Gain Before Feedback)","Запас зависит от микрофона, угла и положения монитора и от помещения. Монитор направляют в зону минимальной чувствительности микрофона, а она зависит от диаграммы направленности: у кардиоиды это тыл, у суперкардиоиды и гиперкардиоиды сзади-сбоку. Сначала решайте положением и уровнем, потом EQ."]];
const PGUIDE=[["Обратная связь (Feedback Control)","Обратная связь возникает, когда звук из акустики возвращается в микрофон и усиливается снова. Порядок действий: 1) положение: микрофон не должен смотреть в акустику, монитор ставят в зону минимальной чувствительности микрофона; 2) расстояние: чем ближе микрофон к источнику, тем меньше нужно усиления (в свободном поле сокращение дистанции вдвое даёт около +6 дБ к уровню источника); 3) число открытых микрофонов: мьютьте неиспользуемые каналы; 4) только затем узкие срезы EQ по частоте звона (метод Ring Out): медленно повышайте уровень, найдите звон и срежьте его узким фильтром небольшой глубины. Если звон перескакивает на соседние частоты, запас по усилению исчерпан, и новые срезы лишь ухудшат звук."],["Графический или параметрический EQ (Graphic / Parametric)","Графический EQ (чаще всего 31 полоса по 1/3 октавы) удобен для быстрой подстройки зала и мониторов. Параметрический даёт выбор частоты, усиления и добротности (Q), поэтому лучше подходит для каналов и узких проблем. Соседние полосы графического EQ влияют друг на друга, поэтому избегайте «гребёнки» из глубоких срезов подряд. Большие подъёмы в обоих типах уменьшают запас до обратной связи."]];
const STUDIO=[["Корректирующий EQ (Corrective)","Решает конкретные проблемы: резонансы, мутность, шипение."],["Творческий EQ (Creative)","Формирует характер. Меняйте осознанно, сверяйте на других системах."]];
const TRAIN=[["Частота (Frequency)","Число колебаний в секунду, Гц. Одна октава равна удвоению частоты: 100 → 200 → 400 Гц."],["Усиление (Gain)","Подъём или срез уровня в дБ на выбранной частоте. Малые изменения 1–3 дБ уже слышны."],["Добротность (Q Factor)","Чем выше Q, тем уже полоса. Низкий Q (0,5–1) мягкий и музыкальный, высокий (4+) хирургический."],["Колокол (Bell Filter)","Поднимает или срезает область вокруг центральной частоты."],["Фильтр высоких (High Pass Filter, HPF)","Пропускает частоты выше среза, убирая гул и низ, который источник не производит."],["Фильтр низких (Low Pass Filter, LPF)","Убирает высоту выше среза: шипение, шум."],["Полочный (Shelf Filter)","Меняет всё выше (High Shelf) или ниже (Low Shelf) выбранной частоты."],["Маскировка (Frequency Masking)","Громкий звук делает неслышным близкий по частоте. Часто решается аранжировкой и панорамой."],["Метод поиска (Sweep EQ)","Поднимите узкий bell на +6…+10 дБ, плавно водите по спектру, найдите неприятное место, затем срежьте умеренно."],["Как слушать диапазоны","Сравнивайте до/после на одинаковой громкости, делайте паузы, проверяйте на разных системах."]];
/* ===== UI ===== */
const $=s=>document.querySelector(s),app=$('#app');
let labStop=null;const NAV=['live','studio','lib','conf','prob','lab'];
const fmt=h=>h>=1000?(h/1000).toString().replace('.',',')+' кГц':h+' Гц';
const warn='<div class="warn">Все значения ориентировочные и зависят от инструмента, исполнителя, микрофона, помещения и микса. Это не универсальные пресеты: слушайте и проверяйте.</div>';
const acc=a=>a.map(([t,b])=>`<details><summary>${t}</summary><p>${b}</p></details>`).join('');
const allIns=()=>Object.entries(CAT).flatMap(([c,l])=>l.map(n=>({c,n})));
function route(){if(labStop){labStop();labStop=null}const h=location.hash.slice(1)||'lib',[p,arg]=h.split('/');$('#nav').innerHTML=NAV.map(k=>`<a href="#${k}" class="${k===p?'on':''}">${T(k)}</a>`).join('');
 ({live:live,studio:()=>pageText(T('studio'),'Для студийной работы',STUDIO,'studio'),lib:()=>lib(),ins:()=>ins(decodeURIComponent(arg||'')),conf:conf,prob:prob,lab:lab,train:lab}[p]||lib)();window.scrollTo(0,0)}
function live(){const f=isPro(),grp=(h,l)=>`<h2>${h}</h2>${acc(f?l:l.slice(0,FREE_TXT))}${f?'':lock('Остальные темы входят в полную версию.')}`;
 app.innerHTML=`<h1>${T('live')}</h1><p class="mu">Концертная звукорежиссура: зал и сцена.</p>${warn}${grp('FOH (Front of House)',FOH)}${grp('Мониторы (Monitor Mixing)',MON)}<h2>Рекомендации по инструментам</h2><div class="grid">${Object.keys(INS).filter(AV).map(n=>`<a class="card" href="#ins/${encodeURIComponent(n)}"><h3>${n}</h3><small>${INS[n].live}</small></a>`).join('')}</div>`}
function pageText(t,sub,list,mode){const full=isPro(),cards=mode==='live'||mode==='studio';app.innerHTML=`<h1>${t}</h1><p class="mu">${sub}</p>${warn}${acc(full?list:list.slice(0,FREE_TXT))}${full?'':lock('Остальные темы раздела входят в полную версию.')}${cards?`<h2>Рекомендации по инструментам</h2><div class="grid">${Object.keys(INS).filter(AV).map(n=>`<a class="card" href="#ins/${encodeURIComponent(n)}"><h3>${n}</h3><small>${mode==='live'?INS[n].live:'HPF ≈ '+INS[n].hpf[1]+', LPF ≈ '+INS[n].lpf[1]}</small></a>`).join('')}</div>`:''}`}
let q='',cat='ALL';
function lib(){app.innerHTML=`<h1>${T('lib')}</h1>${isPro()?'':lock('Демо-версия: доступны 4 инструмента. В полной версии открыты все инструменты, все частотные конфликты, полные разделы и тренажёр слуха.')}<p class="mu">Поиск и фильтр по категории.</p><input id="q" placeholder="Поиск инструмента" value="${q}" aria-label="Поиск"><div class="chips" id="ch"></div><div class="grid" id="gl"></div>`;
 const draw=()=>{$('#ch').innerHTML=['ALL',...Object.keys(CAT)].map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c==='ALL'?'Все':c}</button>`).join('');
 $('#gl').innerHTML=allIns().filter(i=>(cat==='ALL'||i.c===cat)&&i.n.toLowerCase().includes(q.toLowerCase())).map(i=>INS[i.n]&&AV(i.n)?`<a class="card" href="#ins/${encodeURIComponent(i.n)}"><h3>${i.n}</h3><small>${INS[i.n].d}</small><br><span class="tag">${i.c}</span><span class="tag g">данные есть</span></a>`:`<div class="card"><h3>${i.n}</h3><span class="tag">${i.c}</span><span class="tag o">Pro</span></div>`).join('')||'<p class="mu">Ничего не найдено. Измените запрос или категорию.</p>';
 document.querySelectorAll('#ch button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()})};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}
function ins(n){const i=INS[n];if(!i){location.hash='lib';return}
 if(!AV(n)){app.innerHTML=`<p><a href="#lib" class="mu">← Библиотека</a></p><h1>${n}</h1>`+lock('Страница этого инструмента входит в полную версию.');return}
 const kv=[['Основная частота (Fundamental)',i.fund],['Диапазон',i.rng],['Гармоники (Harmonics)',i.harm],['Атака (Attack)',i.att],['Тело (Body)',i.body],['Присутствие (Presence)',i.pres],['Яркость (Brightness)',i.bri],['HPF Live / Studio',i.hpf.join(' / ')],['LPF Live / Studio',i.lpf.join(' / ')],['Возможные конфликты',i.conf.join(', ')]];
 const pr=Object.entries(i.prob).map(([k,r])=>`<span class="tag o">${PR[k].n.split('—')[0]} ${fmt(r[0])}–${fmt(r[1])}</span>`).join('');
 app.innerHTML=`<p><a href="#lib" class="mu">← Библиотека</a></p><h1>${n}</h1><p>${i.d}</p>${warn}<div class="kv">${kv.map(([a,b])=>`<div><span>${a}</span>${b}</div>`).join('')}</div><h2>Проблемные области</h2><p>${pr}</p><h2>Для живого звука</h2><p>${i.live}</p><h2>Частотные области</h2><p class="mu">Нажмите строку, чтобы раскрыть подробности.</p><div class="sc"><table><tr><th>Диапазон</th><th>Область</th><th>На слух</th><th>Подъём</th><th>Срез</th></tr>${BANDS.map((b,k)=>`<tr class="cl" data-k="${k}"><td class="f">${fmt(b.r[0])}–${fmt(b.r[1])}</td><td>${b.n}</td><td>${b.h}</td><td>${b.up}</td><td>${b.dn}</td></tr><tr class="dt" hidden><td colspan="5"><b>Когда применять:</b> ${b.when}<br><b>Побочные эффекты:</b> ${b.fx}</td></tr>`).join('')}</table></div>`;
 document.querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>{r.nextElementSibling.hidden=!r.nextElementSibling.hidden})}
function prob(){app.innerHTML=`<h1>${T('prob')}</h1>${warn}<div class="row"><select id="pi">${Object.keys(INS).filter(AV).map(n=>`<option>${n}</option>`).join('')}</select><select id="pp">${Object.entries(PR).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div><div id="po"></div><h2>Практика на площадке (Live Troubleshooting)</h2>${acc(isPro()?PGUIDE:PGUIDE.slice(0,FREE_TXT))}${isPro()?'':lock('Остальные практические разделы входят в полную версию.')}`;
 const go=()=>{const i=INS[$('#pi').value],k=$('#pp').value,p=PR[k],r=i.prob[k]||p.r;$('#po').innerHTML=`<div class="out"><h3>${p.n}</h3><p><b>Диапазон:</b> <span class="ok">${fmt(r[0])}–${fmt(r[1])}</span> ${i.prob[k]?'(для выбранного инструмента)':'(общий ориентир)'}</p><p><b>Возможные причины:</b></p><ul>${p.why.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Диагностика:</b> ${p.dx}</p><p><b>Решения:</b> ${p.fix.join('; ')}.</p><p class="bad"><b>Проверьте до EQ:</b> ${p.chk}</p></div>`};$('#pi').onchange=$('#pp').onchange=go;go()}
function conf(){app.innerHTML=`<h1>${T('conf')}</h1>${warn}${CONF.slice(0,isPro()?99:FREE_CONF).map(c=>`<details><summary>${c.n}</summary><p><b>Диапазоны:</b> ${c.r}</p><p><b>Проявление:</b> ${c.s}</p><p><b>Как найти источник:</b> ${c.f}</p><p><b>Решения:</b></p><ul>${c.x.map(x=>`<li>${x}</li>`).join('')}</ul><p class="bad"><b>Почему не всегда резать оба:</b> ${c.w}</p></details>`).join('')}${isPro()?'':lock('Остальные пары инструментов входят в полную версию.')}`}
/* ===== SOUND LAB ===== */
const TABS=[['theory','Теория',0],['rta','RTA',1],['delay','Delay',0],['tone','Тон',0],['spl','Шум',1],['ear','Угадай частоту',1]],TOOLS={};let labTab='theory',AC=null;
const actx=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();return AC};
const loop=f=>{let on=true;const s=t=>{if(on){f(t);requestAnimationFrame(s)}};requestAnimationFrame(s);return()=>{on=false}};
const cvs=(box,h)=>{const c=document.createElement('canvas'),x=c.getContext('2d');c.style.cssText='width:100%;height:'+h+'px;background:#17191b;border:1px solid var(--ln);border-radius:8px;display:block;margin:10px 0';box.appendChild(c);const fit=()=>{const d=devicePixelRatio||1;c.width=Math.max(1,c.clientWidth*d);c.height=h*d;x.setTransform(d,0,0,d,0,0)};new ResizeObserver(fit).observe(c);fit();return[x,()=>c.clientWidth]};
const noiseBuf=(c,kind)=>{const bf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=bf.getChannelData(0);let b0=0,b1=0,b2=0;for(let i=0;i<d.length;i++){const r=Math.random()*2-1;if(kind==='white')d[i]=r*.5;else{b0=.99765*b0+r*.099;b1=.963*b1+r*.2965;b2=.57*b2+r*1.05;d[i]=(b0+b1+b2+r*.18)*.12}}return bf};
function lab(){app.innerHTML=`<h1>${T('lab')}</h1><div class="chips" id="lt">${TABS.map(([k,n,p])=>`<button data-k="${k}" class="${k===labTab?'on':''}">${n}${p&&!isPro()?' · Pro':''}</button>`).join('')}</div><div id="lb"></div>`;
 document.querySelectorAll('#lt button').forEach(b=>b.onclick=()=>{if(labStop){labStop();labStop=null}labTab=b.dataset.k;lab()});
 const t=TABS.find(x=>x[0]===labTab);if((t[2]&&!isPro())||!TOOLS[labTab])$('#lb').innerHTML=lock('Этот инструмент входит в полную версию.');else TOOLS[labTab]($('#lb'))}
TOOLS.theory=b=>{b.innerHTML=acc(TRAIN)};
TOOLS.delay=b=>{b.innerHTML=`<div class="warn">Задержка выравнивает задержанные колонки с основной системой по времени прихода звука. Скорость звука зависит от температуры, поэтому при перепаде погоды расчёт стоит обновить.</div><div class="row"><label>Расстояние, м<input id="dd" type="number" inputmode="decimal" value="30" min="0" step="0.5"></label><label>Температура, °C<input id="dt" type="number" inputmode="decimal" value="20" step="1"></label><label>Добавка, мс (по вкусу, часто 5–15)<input id="do" type="number" inputmode="decimal" value="0" step="1"></label></div><div class="out"><div class="big" id="dv" style="color:var(--or)">0 мс</div><p id="dx" class="mu"></p></div>`;
 const[x,W]=cvs(b,110);let tg=0,sh=0;
 const calc=()=>{const d=Math.max(0,+$('#dd').value||0),tp=+$('#dt').value||0,o=+$('#do').value||0,c=331.3+.606*tp,t=d/c*1000;tg=t+o;$('#dx').textContent=`Скорость звука ≈ ${c.toFixed(1)} м/с. ${d} м ≈ ${(d*3.2808).toFixed(0)} фт. Время пробега ${t.toFixed(1)} мс${o?' + добавка '+o+' мс':''}.`};
 ['#dd','#dt','#do'].forEach(s=>$(s).oninput=calc);calc();
 labStop=loop(t=>{sh+=(tg-sh)*.12;$('#dv').textContent=sh.toFixed(1)+' мс';const w=W(),p=(t%2600)/2600,r=p*(w-60);x.clearRect(0,0,w,110);
  x.strokeStyle='#363a40';x.lineWidth=1;x.beginPath();x.moveTo(30,80);x.lineTo(w-30,80);x.stroke();
  for(let k=0;k<3;k++){const rr=r-k*22;if(rr>0){x.strokeStyle=`rgba(45,212,191,${.8-k*.25})`;x.lineWidth=3;x.beginPath();x.arc(30,80,rr,-1,1);x.stroke()}}
  x.fillStyle='#2dd4bf';x.fillRect(22,66,16,28);x.fillStyle=r>=w-62?'#ff8a3d':'#9aa1a9';x.fillRect(w-38,66,16,28);x.fillStyle='#9aa1a9';x.font='12px Manrope';x.fillText('Основная система',10,20);x.fillText('Задержанная',w-92,20)})};
TOOLS.tone=b=>{b.innerHTML=`<div class="row"><label>Сигнал<select id="tw"><option value="sine">Синус (Sine)</option><option value="square">Квадрат (Square)</option><option value="triangle">Треугольник (Triangle)</option><option value="sawtooth">Пила (Sawtooth)</option><option value="pink">Розовый шум (Pink Noise)</option><option value="white">Белый шум (White Noise)</option></select></label><label>Частота: <b id="tfv"></b><input id="tf" type="range" min="0" max="1000" value="500"></label><label>Уровень: <b id="tlv"></b><input id="tl" type="range" min="-60" max="-6" value="-30"></label></div><div class="chips" id="tp"></div><div class="row"><button id="tg">Включить</button></div><p class="mu">Начинайте с низкого уровня и повышайте осторожно: громкий тон вредит слуху и аппаратуре.</p>`;
 const fq=()=>20*Math.pow(1000,$('#tf').value/1000),lv=()=>Math.pow(10,$('#tl').value/20);let on=false,o,g,an,buf=null,pkv=.05,tr=null;
 const upd=()=>{$('#tfv').textContent=(fq()>=1000?(fq()/1000).toFixed(2)+' кГц':fq().toFixed(0)+' Гц');$('#tlv').textContent=$('#tl').value+' дБFS';if(on){const c=AC;if(o.frequency)o.frequency.setTargetAtTime(fq(),c.currentTime,.03);g.gain.setTargetAtTime(lv(),c.currentTime,.03)}};
 const stop=()=>{if(!on)return;on=false;g.gain.setTargetAtTime(0,AC.currentTime,.03);const q=o;setTimeout(()=>{try{q.stop()}catch(e){}},160);$('#tg').textContent='Включить'};
 const start=()=>{const c=actx(),w=$('#tw').value;g=c.createGain();g.gain.value=0;an=c.createAnalyser();an.fftSize=2048;buf=new Uint8Array(an.fftSize);
  if(w==='pink'||w==='white'){o=c.createBufferSource();o.buffer=noiseBuf(c,w);o.loop=true}else{o=c.createOscillator();o.type=w;o.frequency.value=fq()}
  o.connect(g).connect(an).connect(c.destination);o.start();g.gain.setTargetAtTime(lv(),c.currentTime,.03);on=true;$('#tg').textContent='Выключить'};
 $('#tg').onclick=()=>on?stop():start();$('#tw').onchange=()=>{if(on){stop();setTimeout(start,200)}};$('#tf').oninput=$('#tl').oninput=upd;upd();
 $('#tp').innerHTML=[50,100,440,1000,5000,10000].map(f=>`<button data-f="${f}">${f>=1000?f/1000+' кГц':f+' Гц'}</button>`).join('');
 document.querySelectorAll('#tp button').forEach(x=>x.onclick=()=>{$('#tf').value=1000*Math.log(x.dataset.f/20)/Math.log(1000);upd()});
 const[x,W]=cvs(b,130);const st=loop(()=>{const w=W();x.clearRect(0,0,w,130);x.strokeStyle='#363a40';x.lineWidth=1;x.beginPath();x.moveTo(0,65);x.lineTo(w,65);x.stroke();
  x.strokeStyle='#2dd4bf';x.lineWidth=2.5;x.beginPath();if(on&&buf){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128)/128);pkv+=(Math.max(m,.03)-pkv)*.1;const sc=.9/pkv,n=o.frequency?Math.min(buf.length,Math.max(32,Math.round(AC.sampleRate/fq()*3))):1024;for(let i=0;i<n;i++){const X=i/n*w,Y=65-((buf[i]-128)/128)*sc*58;i?x.lineTo(X,Y):x.moveTo(X,Y)}}else{x.moveTo(0,65);x.lineTo(w,65)}x.stroke()});
 labStop=()=>{stop();st()}};


window.addEventListener('hashchange',route);route();
</script></body></html>
